application:
  team: imagerie

#  --------------------------------------------------------
#  Karnak Application Profiles
#  --------------------------------------------------------
name: KARNAK-Profile
environment: LOCAL
karnakadmin: ${KARNAK_ADMIN:admin}
karnakpassword: ${KARNAK_PASSWORD:karnak}
karnakpostgreskey: ${DB_ENCRYPTION_KEY}

# - Logs
logging:
  level:
    org:
      springframework: INFO
      karnak: INFO
      hibernate:
        orm:
          # Suppress WARN of HHH90006001 in Hibernate 6
          incubating: ERROR
      atmosphere:
         cpr:
           # Suppress WARN  a.c.c.AtmosphereFramework - No BroadcasterCache configured
           AtmosphereFramework: ERROR
    com:
      vaadin:
        copilot:
          # Dev-mode Copilot has no enable/disable flag and its release-note fetch
          # fails behind TLS-inspecting proxies (PKIX path building failed). The call
          # is cosmetic, so silence its logger to drop the noisy stack trace.
          VersionReleaseNoteHandler: "OFF"
        flow:
          server:
            communication:
              # Suppress WARN  c.v.f.s.c.ReturnChannelHandler - Ignoring update for disabled return channel
              rpc:
                MapSyncRpcHandler: ERROR
              ReturnChannelHandler: ERROR
server:
  port: 8081
  servlet:
    session:
      persistent: false
  forward-headers-strategy: NATIVE
spring:
  application:
    name: karnak
    version: '@project.version@'
  cloud:
    config:
      #    Currently no cs configured in docker deploy/ vault
      fail-fast: true
      name: ${spring.application.name}
      label: ${ENVIRONMENT}
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  profiles:
    active: docker,redis,eureka
  datasource:
    url: 'jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:karnak}'
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:karnak}
    password: ${DB_PASSWORD:karnak}
    hikari:
      pool-name: karnak
      leak-detection-threshold: 0
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 270000 # 4 minutes 30 secondes
      validation-timeout: 3000
      connection-test-query: SELECT 1
      connection-init-sql: select set_config('encryption.key', '${DB_ENCRYPTION_KEY}', false)
  mustache:
    check-template-location: false
  jpa:
    hibernate:
      # First time to create the db the value must be: create
      ddl-auto: none
    generate-ddl: false
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        #  To still use the unique hibernate_sequence, otherwise we should create a sequence table_name_seq for each table
        id:
          db_structure_naming_strategy: legacy
        boot:
          use_jdbc_metadata_defaults: false
        jdbc:
          lob:
            non_contextual_creation: true

# - Info
info:
  component: Karnak
  app:
    name: Karnak
    description: Karnak
  environment: ${ENVIRONMENT}
  tags:
    eureka.datacenter: ${eureka.datacenter}
    eureka.instance-id: ${eureka.instance.instance-id}
management:
  endpoint:
    health:
      show-details: always
    # https://github.com/spring-projects/spring-boot/issues/20509
    env:
      post.enabled: true
    #issue with spring cloud Hoxton.SR10 and sup
    restart:
      enabled: false
    pause:
      enabled: false
    shutdown:
      enabled: false
  endpoints:
    web:
      exposure:
        include: "*"
    enabled-by-default: true
  health:
    config:
      enabled: false
  server:
    port: ${SERVER_MANAGEMENT_PORT:18089}
  info:
    env:
      enabled: true #disabled by default in springboot 2.6
  metrics:
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
      percentiles:
        '[http.server.requests]': 0.5, 0.9, 0.95, 0.99, 0.999
      slo:
        '[http.server.requests]': 50ms, 150ms, 250ms, 400ms
    tags:
      application: ${spring.application.name}
      instance: ${eureka.instance.instance-id}
      team: ${application.team}
  prometheus:
    metrics:
      export:
        enabled: true

monitoring:
  # Maximum number of days in the monitoring history
  max-history-days: 3
cache-api:
  # Cache Time to leave in minutes for API calls
  ttl: 15

mail:
  sender: no-reply@hug.ch

conformance-report:
  # A study report is flushed and emailed when no new instance arrived for this period
  idle-timeout-seconds: 300
  # Safety cap: a study trickling in for longer than this is flushed anyway
  max-study-lifetime-seconds: 14400
