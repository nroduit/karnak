#  ==========================================================================
#  Karnak portable - configuration
#  Lines starting with # are comments. Edit a value, save, and restart Karnak.
#  ==========================================================================

### Web portal, reachable from this computer only: http://localhost:<port>
KARNAK_WEB_PORT=8081
### Open the web portal in the default browser once Karnak is started (true/false)
KARNAK_OPEN_BROWSER=true

### DICOM listener: send the studies to de-identify to this AE Title and port
DICOM_LISTENER_AET=KARNAK-GATEWAY
DICOM_LISTENER_PORT=11112
### Listening in DICOM-S (TLS), if true, required TLS configuration below
DICOM_LISTENER_TLS=false

#  --------------------------------------------------------
#  Automatic pixel de-identification (OCR service that detects
#  the text burned into the images). Optional: when missing, the
#  launcher proposes to download it from GitHub.
#  --------------------------------------------------------
OCR_ENABLED=true
### What to do when the service is not installed: ask | always | never
OCR_AUTO_INSTALL=ask
### Release of the service compatible with this version of Karnak (do not change)
OCR_VERSION=v0.1.0
### OCR model bundled in the downloaded service
OCR_MODEL=PP-OCRv5_mobile
### Base URL Karnak uses to reach the service
OCR_URL=http://localhost:8000
OCR_SERVICE_NAME=image-ocr-identifier

### TLS configuration for DICOM-S
#TLS_KEYSTORE_PATH
#TLS_KEYSTORE_SECRET
#TLS_TRUSTSTORE_PATH
#TLS_TRUSTSTORE_SECRET

#  --------------------------------------------------------
#  Configuration of the SMTP server (email notifications and conformance reports)
#  --------------------------------------------------------
#MAIL_SMTP_HOST=
#MAIL_SMTP_PORT=
#MAIL_SMTP_SENDER=
### Value with authentication should be "SSL" or "STARTTLS"
#MAIL_SMTP_TYPE=
#MAIL_SMTP_USER=
#MAIL_SMTP_SECRET=

#  --------------------------------------------------------
#  Configuration of a DICOM node for local storage
#  --------------------------------------------------------
### Location of the archive path used by the local DICOM node
LOCAL_NODE_STORAGE_PATH=./dicom
LOCAL_NODE_AE_TITLE=KARNAK-LOCAL
LOCAL_NODE_PORT=11115
LOCAL_NODE_FILEPATH_PATTERN={00100010}/{00080060}/{0020000E}/{00080018}.dcm


#  --------------------------------------------------------
#  Configuration of karnak DB
#  --------------------------------------------------------
DB_USER=karnak
DB_PASSWORD=karnak

#  --------------------------------------------------------
#  Configuration of karnak logs
#  --------------------------------------------------------
KARNAK_LOGS_MAX_FILE_SIZE=50MB
KARNAK_LOGS_MIN_INDEX=1
KARNAK_LOGS_MAX_INDEX=10


#  --------------------------------------------------------
#  IDP Configuration: using: "oidc": configure the OpenID Connect identity provider,
#  any other values: load the in memory user configuration
#  --------------------------------------------------------
IDP=undefined
OIDC_CLIENT_ID=undefined
OIDC_CLIENT_SECRET_FILE=undefined
OIDC_ISSUER_URI=undefined
