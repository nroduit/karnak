<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 860" style="width:100%;max-width:1536px;height:auto;display:block;margin:0 auto" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="wf-title wf-desc">
<title id="wf-title">Karnak deployment workflow</title>
<desc id="wf-desc">Modalities, PACS and workstations inside the hospital network send studies to Karnak with DICOM C-STORE. Karnak de-identifies them and forwards them, optionally to an on-site archive with C-STORE, and across the network boundary to a research repository outside the institution with DICOMweb STOW-RS over HTTPS. Only de-identified studies leave the network.</desc>
<defs>
<symbol id="wf-karnak-mark" viewBox="24 24 464 464"><g fill="none" stroke="currentColor" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"><path d="M88 48h336l-24 76H112z"/><path d="M112 124 96 464h320L400 124"/><path d="M189 464 196 224h120l7 240"/></g></symbol>
<linearGradient id="wf-gHex" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d4f9e"/><stop offset=".55" stop-color="#0f7fc4"/><stop offset="1" stop-color="#19c6d4"/></linearGradient>
<linearGradient id="wf-gTeal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c9a8b"/><stop offset="1" stop-color="#1cbcaa"/></linearGradient>
<linearGradient id="wf-gGreen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#15803d"/><stop offset="1" stop-color="#22a552"/></linearGradient>
<linearGradient id="wf-gBand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9f2fd"/><stop offset=".5" stop-color="#eaf6fa"/><stop offset="1" stop-color="#e9f9f1"/></linearGradient>
<filter id="wf-shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#0d4f9e" flood-opacity=".18"/></filter>
<marker id="wf-arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2f6fb5"/></marker>
<marker id="wf-arrowTeal" viewBox="-1 -1 12 12" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#0c9a8b"/><path d="M0 0 10 5 0 10" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/></marker>
</defs>
<rect width="1536" height="860" fill="#ffffff"/>

<!-- header -->
<text x="56" y="72" font-size="30" fill="#14356e" font-weight="800">DEPLOYMENT WORKFLOW</text>
<text x="56" y="104" font-size="20" fill="#2f6fb5">From the imaging network to a research repository</text>

<!-- trusted zone: the hospital / imaging center network -->
<rect x="32" y="128" width="880" height="530" rx="22" fill="#e9f2fd"/>
<text x="56" y="164" font-size="18" fill="#14356e" font-weight="800" letter-spacing="1.5">HOSPITAL OR IMAGING CENTER NETWORK</text>
<text x="56" y="188" font-size="15" fill="#4a6f9e">Trusted zone: DICOM traffic never leaves it</text>

<!-- sources -->
<g fill="none" stroke="#2f6fb5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
<rect x="56" y="214" width="264" height="84" rx="16" fill="#ffffff" stroke="none"/>
<rect x="72" y="234" width="44" height="44" rx="12" fill="#e9f2fd" stroke="none"/>
<g transform="translate(82 244)"><path d="M12 3.2 20.4 7.6 12 12 3.6 7.6Z"/><path d="M3.6 12.2 12 16.6l8.4-4.4"/><path d="M3.6 16.6 12 21l8.4-4.4"/></g>
<rect x="56" y="318" width="264" height="84" rx="16" fill="#ffffff" stroke="none"/>
<rect x="72" y="338" width="44" height="44" rx="12" fill="#e9f2fd" stroke="none"/>
<g transform="translate(82 348)"><ellipse cx="12" cy="6" rx="7" ry="2.8"/><path d="M5 6v5c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8V6"/><path d="M5 11v5c0 1.6 3.1 2.8 7 2.8s7-1.2 7-2.8v-5"/></g>
<rect x="56" y="422" width="264" height="84" rx="16" fill="#ffffff" stroke="none"/>
<rect x="72" y="442" width="44" height="44" rx="12" fill="#e9f2fd" stroke="none"/>
<g transform="translate(82 452)"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g>
</g>
<text x="132" y="250" font-size="19" fill="#14356e" font-weight="700">Modalities</text>
<text x="132" y="274" font-size="15" fill="#4a6f9e">CT, MR, US, XA, MG, …</text>
<text x="132" y="354" font-size="19" fill="#14356e" font-weight="700">PACS / VNA</text>
<text x="132" y="378" font-size="15" fill="#4a6f9e">Archive routing rules</text>
<text x="132" y="458" font-size="19" fill="#14356e" font-weight="700">Workstations</text>
<text x="132" y="482" font-size="15" fill="#4a6f9e">Manual or scripted send</text>

<!-- fan-in to the gateway -->
<g fill="none" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" marker-end="url(#wf-arrow)">
<path d="M320 256C410 256 410 372 490 372"/>
<path d="M320 360C410 360 410 400 490 400"/>
<path d="M320 464C410 464 410 428 490 428"/>
</g>
<rect x="366" y="358" width="78" height="46" rx="10" fill="#ffffff" stroke="#cfe2f5" stroke-width="1.5"/>
<text x="405" y="378" font-size="18" fill="#2f6fb5" font-weight="700" text-anchor="middle">DICOM</text>
<text x="405" y="397" font-size="14" fill="#2f6fb5" text-anchor="middle">C-STORE</text>

<!-- on-site destination -->
<path d="M600 282V240H684" fill="none" stroke="#2f6fb5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#wf-arrow)"/>
<text x="642" y="232" font-size="13" fill="#2f6fb5" text-anchor="middle">C-STORE</text>
<rect x="690" y="196" width="220" height="88" rx="16" fill="#ffffff"/>
<rect x="706" y="218" width="44" height="44" rx="12" fill="#e9f2fd"/>
<g transform="translate(716 228)" fill="none" stroke="#2f6fb5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="1.6"/><rect x="3" y="14" width="18" height="7" rx="1.6"/><path d="M7 6.5h.01M7 17.5h.01"/></g>
<text x="766" y="232" font-size="18" fill="#14356e" font-weight="700">On-site archive</text>
<text x="766" y="254" font-size="14" fill="#4a6f9e">Research PACS</text>
<text x="766" y="272" font-size="14" fill="#4a6f9e">inside the network</text>

<!-- the gateway -->
<polygon points="600,274 709.1,337 709.1,463 600,526 490.9,463 490.9,337" fill="#19c6d4" opacity=".12"/>
<polygon points="600,279 704.8,339.5 704.8,460.5 600,521 495.2,460.5 495.2,339.5" fill="#19c6d4" opacity=".2"/>
<polygon points="600,282 702.2,341 702.2,459 600,518 497.8,459 497.8,341" fill="url(#wf-gHex)" filter="url(#wf-shadow)"/>
<polygon points="600,290 695.3,345 695.3,455 600,510 504.7,455 504.7,345" fill="none" stroke="#ffffff" stroke-width="2" opacity=".35"/>
<use href="#wf-karnak-mark" x="564" y="312" width="72" height="72" color="#f5b05a"/>
<text x="600" y="432" font-size="38" fill="#ffffff" font-weight="800" text-anchor="middle">Karnak</text>
<text x="600" y="458" font-size="14" fill="#c9eef7" font-weight="600" text-anchor="middle" letter-spacing="3">DICOM GATEWAY</text>

<!-- web portal -->
<path d="M600 518V550" stroke="#a6b3c3" stroke-width="3" stroke-dasharray="4 5" stroke-linecap="round"/>
<rect x="450" y="550" width="300" height="84" rx="16" fill="#ffffff"/>
<rect x="466" y="570" width="44" height="44" rx="12" fill="#e9f2fd"/>
<g transform="translate(476 580)" fill="none" stroke="#2f6fb5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="4" width="18.8" height="16" rx="2.4"/><path d="M2.6 9h18.8M6.2 6.5h.01M9.2 6.5h.01"/><path d="M6 13h5M6 16.5h9"/></g>
<text x="526" y="586" font-size="19" fill="#14356e" font-weight="700">Web portal</text>
<text x="526" y="610" font-size="15" fill="#4a6f9e">Configuration and monitoring</text>

<!-- research repository, outside the institution -->
<rect x="1008" y="128" width="496" height="530" rx="22" fill="#e8f7f1"/>
<text x="1032" y="164" font-size="18" fill="#14356e" font-weight="800" letter-spacing="1.5">RESEARCH REPOSITORY</text>
<text x="1032" y="188" font-size="15" fill="#4a6f9e">Another institution, a research network or the cloud</text>

<rect x="1032" y="212" width="448" height="84" rx="16" fill="url(#wf-gGreen)" filter="url(#wf-shadow)"/>
<circle cx="1074" cy="254" r="24" fill="#ffffff"/>
<g transform="translate(1060 240) scale(1.1667)" fill="none" stroke="#15803d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 19 5.8v5.4c0 4.5-2.9 7.6-7 9-4.1-1.4-7-4.5-7-9V5.8z"/><path d="M8.6 11.8 11 14.2l4.4-4.4"/></g>
<text x="1114" y="248" font-size="18" fill="#ffffff" font-weight="700">Only de-identified studies get out</text>
<text x="1114" y="274" font-size="14" fill="#e6f7ec">Pseudonyms, shifted dates, new UIDs, masked pixels</text>

<rect x="1032" y="324" width="448" height="156" rx="20" fill="url(#wf-gTeal)" filter="url(#wf-shadow)"/>
<circle cx="1088" cy="402" r="30" fill="#ffffff"/>
<g transform="translate(1072 386) scale(1.3333)" fill="none" stroke="#2b6fb0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17.5a4.3 4.3 0 0 1-.5-8.6 6 6 0 0 1 11.5 1.6 3.6 3.6 0 0 1-.3 7"/><rect x="9" y="13.5" width="6.5" height="5.5" rx="1"/><path d="M10.4 13.5v-1.3a1.85 1.85 0 0 1 3.7 0v1.3"/></g>
<text x="1134" y="368" font-size="22" fill="#ffffff" font-weight="700">DICOMweb archive</text>
<text x="1134" y="398" font-size="16" fill="#eaf6fb">STOW-RS endpoint behind TLS</text>
<text x="1134" y="422" font-size="16" fill="#eaf6fb">OAuth 2 bearer token or Basic auth</text>
<text x="1134" y="446" font-size="16" fill="#eaf6fb">Research PACS or cloud archive</text>

<rect x="1032" y="506" width="448" height="116" rx="16" fill="#ffffff"/>
<rect x="1048" y="542" width="44" height="44" rx="12" fill="#e8f7f1"/>
<g transform="translate(1058 552)" fill="none" stroke="#0c9a8b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7.2" r="3.2"/><path d="M3.4 19.2a5.6 5.6 0 0 1 11.2 0"/><circle cx="17" cy="8.4" r="2.6"/><path d="M15.2 19.2h5.4a4.5 4.5 0 0 0-3.2-4.3"/></g>
<text x="1108" y="548" font-size="19" fill="#14356e" font-weight="700">Research team</text>
<text x="1108" y="572" font-size="15" fill="#4a6f9e">Viewers, analysis pipelines and AI training</text>
<text x="1108" y="594" font-size="15" fill="#4a6f9e">on a reproducible, shareable dataset</text>

<!-- outbound flow across the boundary -->
<path d="M706 400H1027" fill="none" stroke="#0c9a8b" stroke-width="5" stroke-linecap="butt" marker-end="url(#wf-arrowTeal)"/>
<text x="812" y="378" font-size="20" fill="#0c9a8b" font-weight="800" text-anchor="middle">DICOMweb</text>
<text x="812" y="426" font-size="14" fill="#3d8c68" text-anchor="middle">STOW-RS over HTTPS</text>

<!-- network boundary: a firewall on each side -->
<line x1="960" y1="128" x2="960" y2="658" stroke="#d97706" stroke-width="2.5" stroke-dasharray="10 8"/>
<rect x="916" y="150" width="88" height="46" rx="12" fill="#ffffff" stroke="#fcd9a0" stroke-width="2"/>
<text x="960" y="169" font-size="12" fill="#d97706" font-weight="800" text-anchor="middle" letter-spacing="1">NETWORK</text>
<text x="960" y="187" font-size="12" fill="#d97706" font-weight="800" text-anchor="middle" letter-spacing="1">BOUNDARY</text>
<g id="wf-firewall" fill="#fb923c" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round">
<rect x="920" y="370" width="32" height="60" rx="3"/>
<g fill="none" stroke="#ffffff" stroke-width="1.6" opacity=".9"><path d="M920 385h32M920 400h32M920 415h32"/><path d="M936 370v15M928 385v15M944 385v15M936 400v15M928 415v15M944 415v15"/></g>
</g>
<use href="#wf-firewall" x="48"/>
<text x="960" y="452" font-size="12" fill="#d97706" font-weight="700" text-anchor="middle">Firewalls</text>
<!-- why DICOMweb for external destinations -->
<rect x="32" y="684" width="1472" height="150" rx="24" fill="url(#wf-gBand)"/>
<text x="56" y="722" font-size="18" fill="#14356e" font-weight="800" letter-spacing="1">WHY DICOMweb FOR DESTINATIONS OUTSIDE THE NETWORK</text>
<circle cx="63" cy="751" r="5" fill="#2f6fb5"/>
<text x="80" y="756" font-size="16" fill="#25476f" font-weight="700">DICOM C-STORE is for trusted networks</text>
<text x="80" y="780" font-size="14" fill="#4a6f9e">It has no authentication or encryption by default:</text>
<text x="80" y="800" font-size="14" fill="#4a6f9e">never expose a DICOM port on the Internet.</text>
<circle cx="553" cy="751" r="5" fill="#0c9a8b"/>
<text x="570" y="756" font-size="16" fill="#25476f" font-weight="700">STOW-RS rides on HTTPS</text>
<text x="570" y="780" font-size="14" fill="#4a6f9e">TLS encryption, OAuth 2 or Basic authentication,</text>
<text x="570" y="800" font-size="14" fill="#4a6f9e">reverse proxies and firewalls apply as usual.</text>
<circle cx="1043" cy="751" r="5" fill="#16a34a"/>
<text x="1060" y="756" font-size="16" fill="#25476f" font-weight="700">Outbound only</text>
<text x="1060" y="780" font-size="14" fill="#4a6f9e">Karnak opens a single outbound HTTPS connection;</text>
<text x="1060" y="800" font-size="14" fill="#4a6f9e">no inbound port is required on the hospital side.</text>
</svg>
